<style>
:root{--bg:#f5f5f6;--card:#fff;--ink:#1c1c1e;--mute:#6b6b72;--a:#7b323b;--line:#e3e3e6;--hl:#f3e8ea;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f11;--card:#1a1a1d;--ink:#f2f2f3;--mute:#a1a1a9;--a:#d98595;--line:#2b2b30;--hl:#2a1b1e;--on:#0f0f11}}
:root[data-theme="dark"]{--bg:#0f0f11;--card:#1a1a1d;--ink:#f2f2f3;--mute:#a1a1a9;--a:#d98595;--line:#2b2b30;--hl:#2a1b1e;--on:#0f0f11}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior:none}html,body{height:100%;margin:0;background:#0f0709}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:430px;height:100%;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
.link{margin-top:14px;font-weight:600;opacity:.85;color:inherit}
.app{height:100%;display:flex;flex-direction:column}
.main{flex:1;overflow:auto;padding:8px 16px 110px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;animation:in .35s ease both}
.card h3{margin:0 0 4px;font-size:1rem}.m{color:var(--mute);font-size:.85rem}
.big{font-size:1.6rem;font-weight:800;color:var(--a)}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow:auto}.chips button{padding:6px 14px;border-radius:99px;border:2px solid var(--a);font-weight:600;white-space:nowrap}.chips button.on{background:var(--a);color:#fff}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--a)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--hl);color:var(--a);white-space:nowrap}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:#1d0b10;color:#fff;padding:12px 14px;border-radius:12px;font-size:.9rem;animation:in .3s ease both}
.note{text-align:center;color:var(--mute);font-size:.78rem;margin-top:6px}
.hero{height:100%;display:flex;flex-direction:column;background:var(--bg);animation:in .4s ease both}
.hero .cap{flex:0 0 44%;background:linear-gradient(160deg,#7b323b,#3a1219);border-radius:0 0 50% 50%/0 0 18% 18%;position:relative}
.hero .badge{position:absolute;left:28px;bottom:-46px;width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.hero .badge img{width:70px;height:70px;border-radius:50%}
.hero .txt{flex:1;padding:72px 28px calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;flex-direction:column}
.kick{font-size:.72rem;font-weight:800;letter-spacing:.14em;color:var(--a)}
.hero h1{font-size:1.9rem;line-height:1.15;margin:8px 0 10px}
.hero p{color:var(--mute);line-height:1.6;margin:0}
.go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 22px;border-radius:99px;background:var(--a);color:var(--on);font-weight:700}
.idt{height:100%;display:flex;flex-direction:column;background:linear-gradient(160deg,#7b323b,#3a1219);animation:in .4s ease both}
.idt .hd{padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 26px;color:#fff;display:flex;align-items:center;gap:12px}
.idt .hd button{font-size:1.6rem;color:#fff;line-height:1}.idt .hd img{width:40px;height:40px;border-radius:12px;background:#fff}
.sh{flex:1;background:var(--bg);border-radius:28px 28px 0 0;padding:28px 24px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column}
.sh h1{margin:0 0 6px;font-size:1.5rem}.sh p{margin:0 0 20px;color:var(--mute)}
.sh label{font-size:.78rem;font-weight:700;color:var(--mute);margin:10px 0 6px}
.in{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.in:focus{outline:none;border-color:var(--a)}
.bar0{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px}
.bar0 img{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.bar0 h2{margin:0;font-size:1.15rem}.bar0 small{color:var(--mute)}.bar0 .out{margin-left:auto;font-size:1.3rem}
.fnav{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px}
.fnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.6rem;color:var(--mute);padding:6px 0;border-radius:20px}
.fnav button span{display:grid;height:24px;place-items:center}.fnav button.on{background:var(--hl);color:var(--a);font-weight:800}
.rail{display:flex;gap:12px;overflow:auto;padding-bottom:6px;margin-bottom:12px}
.tile{flex:0 0 140px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;animation:in .35s ease both}
.tl{margin-top:8px;border-left:2px solid var(--line);padding-left:16px}.ev{position:relative;padding:8px 0}
.ev i{position:absolute;left:-23px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--a)}.ev b{display:block;margin-top:4px}
.row .in{flex:1;min-width:0}
.card label{display:block;margin-top:10px}.card .in{margin-top:4px}textarea.in{resize:none}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 8px;background:var(--hl);color:var(--a);display:grid;place-items:center;font-size:2rem;font-weight:800;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.lg{display:inline-block;background:#fff;border-radius:10px;padding:6px 10px}.lg img{display:block;height:34px;width:auto}
.av.sm{width:44px;height:44px;margin:0;font-size:1.1rem}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function shell(t,sub,body){var N=[["home","Mon espace"],["etu","Parcours"],["com","Communauté"],["rech","Recherche"],["msg","Messages"],["pro","Réglages"]];
return `<div class="app"><div class="bar0"><img src="${ME&&ME.p?ME.p:EM}" alt="" style="object-fit:cover"><div><h2>${t}</h2><small>${sub}</small></div></div><div class="main">${body}</div><div class="fnav">${N.map(function(n){return `<button class="${S.tab===n[0]?"on":""}" data-t="${n[0]}" aria-label="${n[1]}"><span>${ic(n[0])}</span>${n[1]}</button>`}).join("")}</div></div>`}
function line(p){var q=p.split("|"),m=[q[2],q[3]].filter(Boolean).join(" · ");return `<div class="row" style="margin-top:10px"><div><b>${esc(q[1])}</b><div class="m">${esc(m)}</div></div><span class="tag">${esc(q[0])}</span></div>`}
function tl(l){var q=l.split("|"),m=[q[2],q[3]].filter(Boolean).join(" · ");return `<div class="ev"><i></i><span class="tag">${esc(q[0])}</span><b>${esc(q[1])}</b><div class="m">${esc(m)}</div></div>`}
function home(){var d=D[(new Date().getDay()+6)%7]||"Dim",L=S.fil==="IUD"?(TT[d]||[]):[];
return `<div class="card"><div class="row"><h3>Aujourd’hui</h3><span class="tag">${d}</span></div>${L.length?`<div class="tl">${L.map(tl).join("")}</div>`:`<p class="m">Aucun cours à afficher aujourd’hui.</p>`}</div><div class="rail"><button class="tile" data-t="etu" data-s="suivi"><div class="m">Assiduité</div><div class="big">92 %</div><span class="tag">démo</span></button><button class="tile" data-t="etu" data-s="suivi"><div class="m">Frais réglés</div><div class="big">67 %</div><span class="tag">démo</span></button><button class="tile" data-t="etu" data-s="exa"><div class="m">Prochaine épreuve</div><b>22 févr. 2027</b></button><button class="tile" data-t="com" data-s="ann"><div class="m">Annonces</div><div class="big">3</div></button></div><p class="note">Prototype : l’assiduité, les frais et les documents sont fictifs.</p>`}
function edt(){if(S.fil!=="IUD")return `<div class="card"><p class="m">L’emploi du temps de cette filière sera bientôt disponible.</p></div>`;return `<div class="chips">${D.map(function(x,i){return `<button class="${i===S.d?"on":""}" data-d="${i}">${x}</button>`}).join("")}</div><div class="card"><div class="m">IUD 1 · démarrage du semestre 1 · 2026-2027</div>${(TT[D[S.d]]||[]).map(line).join("")}</div>`}
function mats(){if(S.fil!=="IUD")return `<div class="card"><p class="m">La liste des matières de cette filière sera bientôt disponible.</p></div>`;var t=0;var r=MAT.map(function(l){var p=l.split("|");t+=parseFloat(p[1].replace(",","."));return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(p[0])}</span><span class="tag">${p[1]} ECTS</span></div>`}).join("");
return `<div class="card"><h3>Droit des Affaires · L1</h3><div class="m">Total : ${String(t).replace(".",",")} ECTS</div>${r}</div>`}
function suivi(){return `<div class="card"><div class="row"><h3>Assiduité</h3><span class="tag">démo</span></div>${PRE.map(function(p){return `<div style="margin-top:10px"><div class="row"><span>${esc(p[0])}</span><b>${p[1]} %</b></div><div class="bar"><i style="width:${p[1]}%"></i></div></div>`}).join("")}</div><div class="card"><div class="row"><h3>Frais de scolarité</h3><span class="tag">démo</span></div><div class="bar"><i style="width:67%"></i></div><div class="m">2 versements sur 3 réglés</div><div class="row" style="margin-top:8px"><span>1er versement</span><b>Réglé</b></div><div class="row"><span>2e versement</span><b>Réglé</b></div><div class="row"><span>3e versement</span><b>À régler</b></div></div>`}
function exa(){return `<div class="card"><h3>Calendrier des épreuves</h3>${EXA.map(function(e){return `<div style="margin-top:10px"><span class="tag">${e[0]}</span><div>${esc(e[1])}</div></div>`}).join("")}</div><div class="card"><h3>Notes</h3><p class="m">Pas encore de note publiée. Elles s’afficheront ici dès que l’école les aura validées.</p></div>`}
function msg(){return `<div class="card"><h3>Dernières annonces</h3>${NOT.map(function(n){return `<div style="margin-top:10px"><span class="tag">${n[0]}</span><div>${esc(n[1])}</div></div>`}).join("")}</div><div class="card"><div class="row"><h3>Documents à demander</h3><span class="tag">démo</span></div>${DOC.map(function(d){return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(d)}</span><button class="tag" data-a="req">Demander</button></div>`}).join("")}</div>`}
function etu(){return chips([["edt","Planning"],["mat","Cours"],["exa","Échéances"],["suivi","Suivi"]],S.e,"e")+({edt:edt,mat:mats,exa:exa,suivi:suivi}[S.e])()}
function com(){return chips([["fil","Fil"],["ann","Annonces"],["grp","Groupes"]],S.c,"c")+(S.c==="ann"?msg():S.c==="grp"?grp():fil())}
function fil(){return `<div class="card"><textarea id="pt" class="in" rows="3" placeholder="Partage une info ou pose une question…"></textarea><button class="go" style="margin-top:10px;padding:12px 18px" data-a="pub"><span>Publier</span><span>→</span></button></div><p class="note">Démo : tes publications restent sur ton téléphone.</p>`+DB.posts.concat(SEED).map(function(p){return `<div class="card"><div class="row"><b>${esc(p.a)}</b>${p.mine?`<button class="tag" data-a="del" data-id="${p.id}">Supprimer</button>`:""}</div><p style="margin:8px 0">${esc(p.t)}</p><button data-a="like" data-id="${p.id}" style="color:var(--a);font-weight:700">${DB.likes[p.id]?"♥":"♡"} J’aime</button></div>`}).join("")}
function grp(){return `<p class="note">Démo : les groupes sont fictifs.</p>`+G.map(function(g,i){return `<div class="card row"><b>${esc(g)}</b><button class="tag" data-a="join" data-id="${i}">${DB.grp[i]?"Rejoint ✓":"Rejoindre"}</button></div>`}).join("")}
function dms(){if(S.chat!==null){var c=CV[S.chat],n=c[1].length,ms=c[1].concat(DB.chats[c[0]]||[]);return `<button class="link" style="color:var(--a);margin:0 0 10px" data-a="cb">‹ Retour</button><div class="card"><h3>${esc(c[0])}</h3>${ms.length?ms.map(function(m,i){return `<div style="margin:8px 0;${i>=n?"text-align:right":""}"><span class="tag" style="font-size:.85rem;font-weight:600;padding:6px 10px">${esc(m)}</span></div>`}).join(""):`<p class="m">Aucun message pour l’instant. Écris le premier !</p>`}</div><div class="row"><input id="mi" class="in" placeholder="Écris un message…"><button class="tag" style="padding:12px 14px" data-a="snd">Envoyer</button></div>`}
return `<p class="note">Démo : les conversations sont fictives et tes messages restent sur ton téléphone.</p>`+CV.map(function(c,i){var l=c[1].concat(DB.chats[c[0]]||[]);return `<button class="card" data-a="op" data-id="${i}"><b>${esc(c[0])}</b><div class="m">${esc(l.length?l[l.length-1]:"Nouvelle conversation")}</div></button>`}).join("")}
function pro(){var m=ME;return `<div class="card" style="text-align:center"><div class="av">${m.p?`<img src="${m.p}" alt="">`:esc((m.n||"?").charAt(0).toUpperCase())}</div><h3>${esc(m.n)}</h3><div class="m">@${esc(m.id||"")} · ${m.st==="prof"?"Professeur":"Étudiant"}${m.t?" · "+esc(m.t):""}</div><p>${m.b?esc(m.b):"Pas encore de présentation."}</p></div><div class="card"><h3>Mon profil</h3><label class="m" for="ph">Ma photo</label><input id="ph" type="file" accept="image/*" class="in"><label class="m" for="ti">Mon intitulé</label><input id="ti" class="in" value="${esc(m.t||"")}" placeholder="Ex. L1 Droit des Affaires"><label class="m" for="bi">À propos de moi</label><textarea id="bi" class="in" rows="3" placeholder="Dis-en un peu plus sur toi…">${esc(m.b||"")}</textarea><button class="go" style="margin-top:12px;padding:12px 18px" data-a="sav"><span>Sauvegarder</span><span>→</span></button></div><div class="card"><h3>Apparence</h3>${chips([["auto","Automatique"],["light","Clair"],["dark","Sombre"]],S.th,"th")}</div><div class="card" style="text-align:center"><div class="lg"><img src="${LG}" alt="Haute École Léonard de Vinci"></div><h3 style="margin-top:12px">À propos</h3><p class="m">HELDV Mobile · version 2.0<br>Application d’étudiant, non officielle.<br>Programme : version 2019.2, à vérifier auprès de l’école.</p></div><button class="link" style="color:var(--a)" data-a="out">Se déconnecter</button>`}
function stu(){var sub=ME.st==="prof"?"Professeur":FN(),T={home:["Bonjour "+esc(ME.n),sub,home],etu:["Mon parcours",sub,etu],com:["Communauté","Fil, annonces et groupes",com],msg:["Messages","Conversations privées",dms],pro:["Réglages",sub,pro],rech:["Recherche","Par nom ou identifiant",rech]}[S.tab];return shell(T[0],T[1],T[2]())}
function draw(){app.innerHTML=S.s==="onb"?onb():S.s==="role"?role():S.s==="ident"?ident():stu()}
function val(i){var x=document.getElementById(i);return x?x.value.trim():""}
app.addEventListener("click",function(e){var b=e.target.closest("[data-a],[data-t],[data-d],[data-k]");if(!b)return;var a=b.dataset.a,id=b.dataset.id;
if(b.dataset.k){if(b.dataset.k==="th")setTh(b.dataset.v);else S[b.dataset.k]=b.dataset.v}
else if(b.dataset.t){S.tab=b.dataset.t;S.chat=null;if(b.dataset.s)S[b.dataset.t==="etu"?"e":"c"]=b.dataset.s}
else if(b.dataset.d){S.d=+b.dataset.d}
else if(a==="start"){S.s="role"}
else if(a==="back"){S.s=S.s==="ident"?"role":"onb"}
else if(a==="st"){S.st=id;S.s="ident"}
else if(a==="go"){var n=val("nm"),f=S.st==="etu"?val("fl"):"",pe=document.getElementById("pw"),p=pe?pe.value:"";S.nm=n;S.fl=f;
if(!n||(S.st==="etu"&&!f)||p.length<4){toast(!n?"Entre ton nom.":(S.st==="etu"&&!f)?"Choisis ta filière.":"Le mot de passe doit faire 4 caractères au moins.");return}
hsh(p).then(function(h){ME={st:S.st,n:n,f:f,t:"",b:"",p:"",id:slug(n),h:h};svMe();S.fil=f;S.s="app";S.tab="home";draw()});return}
else if(a==="out"){if(!confirm("Te déconnecter supprimera le profil enregistré sur ce téléphone. Continuer ?"))return;ME=null;DB={posts:[],likes:{},grp:{},chats:{}};try{localStorage.removeItem("heldv_me");localStorage.removeItem("heldv_db")}catch(x){}S.s="onb";S.st="";S.nm="";S.fl="";S.fil="";S.tab="home"}
else if(a==="pub"){var t=val("pt");if(!t){toast("Écris quelque chose avant de publier.");return}DB.posts.unshift({id:"p"+Date.now(),a:ME.n+" (moi)",t:t,mine:1});sv()}
else if(a==="del"){DB.posts=DB.posts.filter(function(p){return p.id!==id});sv()}
else if(a==="like"){DB.likes[id]=!DB.likes[id];sv()}
else if(a==="join"){DB.grp[id]=!DB.grp[id];sv()}
else if(a==="op"){S.chat=+id}else if(a==="cb"){S.chat=null}
else if(a==="snd"){var m=val("mi");if(!m)return;var k=CV[S.chat][0];(DB.chats[k]=DB.chats[k]||[]).push(m);sv()}
else if(a==="sav"){ME.t=val("ti");ME.b=val("bi");if(S.ph){ME.p=S.ph;S.ph=""}svMe();draw();toast("Profil enregistré.");return}
else if(a==="dm"){var ac=ACC.filter(function(x){return x.id===id})[0],ix=CV.findIndex(function(c){return c[0]===ac.n});if(ix<0){CV.push([ac.n,[]]);ix=CV.length-1}DB.chats[ac.n]=DB.chats[ac.n]||[];sv();S.tab="msg";S.chat=ix}
else if(a==="req"){toast("Demande envoyée (démo).");return}
draw()});
app.addEventListener("change",function(e){var el=e.target;if(el.id!=="ph"||!el.files[0])return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=160;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);S.ph=c.toDataURL("image/jpeg",.8);toast("Photo prête : touche Sauvegarder.")};im.src=r.result};r.readAsDataURL(el.files[0])});
app.addEventListener("input",function(e){if(e.target.id==="sq"){S.q=e.target.value;document.getElementById("rs").innerHTML=srRes()}});
draw();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
