<title>HELDV Mobile</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f7f2f3;--card:#fff;--ink:#2b1217;--mute:#7b5560;--a:#7b323b;--line:#eadadd;--hl:#f6d5da;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#160c0f;--card:#251318;--ink:#f8eaed;--mute:#cfa9b1;--a:#e58a99;--line:#38212a;--hl:#4a222b;--on:#1c0f13}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior:none}html,body{height:100%;margin:0;background:#0f0709}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:430px;height:100%;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
.link{margin-top:14px;font-weight:600;opacity:.85;color:inherit}
.app{height:100%;display:flex;flex-direction:column}
.main{flex:1;overflow:auto;padding:8px 16px 110px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;animation:in .35s ease both}
.card h3{margin:0 0 4px;font-size:1rem}.m{color:var(--mute);font-size:.85rem}
.big{font-size:1.6rem;font-weight:800;color:var(--a)}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow:auto}.chips button{padding:6px 14px;border-radius:99px;border:2px solid var(--a);font-weight:600;white-space:nowrap}.chips button.on{background:var(--a);color:#fff}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--a)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--hl);color:var(--a);white-space:nowrap}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:#1d0b10;color:#fff;padding:12px 14px;border-radius:12px;font-size:.9rem;animation:in .3s ease both}
.note{text-align:center;color:var(--mute);font-size:.78rem;margin-top:6px}
.hero{height:100%;display:flex;flex-direction:column;background:var(--bg);animation:in .4s ease both}
.hero .cap{flex:0 0 44%;background:linear-gradient(160deg,#7b323b,#3a1219);border-radius:0 0 50% 50%/0 0 18% 18%;position:relative}
.hero .badge{position:absolute;left:28px;bottom:-46px;width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.hero .badge img{width:70px;height:70px;border-radius:50%}
.hero .txt{flex:1;padding:72px 28px calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;flex-direction:column}
.kick{font-size:.72rem;font-weight:800;letter-spacing:.14em;color:var(--a)}
.hero h1{font-size:1.9rem;line-height:1.15;margin:8px 0 10px}
.hero p{color:var(--mute);line-height:1.6;margin:0}
.go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 22px;border-radius:99px;background:var(--a);color:var(--on);font-weight:700}
.idt{height:100%;display:flex;flex-direction:column;background:linear-gradient(160deg,#7b323b,#3a1219);animation:in .4s ease both}
.idt .hd{padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 26px;color:#fff;display:flex;align-items:center;gap:12px}
.idt .hd button{font-size:1.6rem;color:#fff;line-height:1}.idt .hd img{width:40px;height:40px;border-radius:12px;background:#fff}
.sh{flex:1;background:var(--bg);border-radius:28px 28px 0 0;padding:28px 24px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column}
.sh h1{margin:0 0 6px;font-size:1.5rem}.sh p{margin:0 0 20px;color:var(--mute)}
.sh label{font-size:.78rem;font-weight:700;color:var(--mute);margin:10px 0 6px}
.in{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.in:focus{outline:none;border-color:var(--a)}
.bar0{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px}
.bar0 img{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.bar0 h2{margin:0;font-size:1.15rem}.bar0 small{color:var(--mute)}.bar0 .out{margin-left:auto;font-size:1.3rem}
.fnav{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px}
.fnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;color:var(--mute);padding:6px 0;border-radius:20px}
.fnav button span{font-size:1.25rem}.fnav button.on{background:var(--hl);color:var(--a);font-weight:800}
.rail{display:flex;gap:12px;overflow:auto;padding-bottom:6px;margin-bottom:12px}
.tile{flex:0 0 140px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;animation:in .35s ease both}
.tl{margin-top:8px;border-left:2px solid var(--line);padding-left:16px}.ev{position:relative;padding:8px 0}
.ev i{position:absolute;left:-23px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--a)}.ev b{display:block;margin-top:4px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

var D=["Lun","Mar","Mer","Jeu","Ven","Sam"];
var TT={
Lun:["8h–10h|Théorie générale de l’acte juridique|Salle 5|M. Nsouari","11h–13h|Méthodologie de présentation des devoirs|Salle 5|M. Takopani","14h–16h|Communication professionnelle écrite|Salle 5|M. Diatsonama"],
Mar:["8h–10h|Anglais des affaires|Salle 5|M. Biyekele","11h–13h|Communication professionnelle orale|Salle 7|Mme Audrey Douabale","14h–16h|Fondements historiques du droit|Salle 6|M. Pandi"],
Mer:["8h–10h|Introduction à la comptabilité|Salle 5|M. Matondzi","11h–13h|Contrats en entreprise|Salle 5|M. Nsouari","14h–16h|Informatique bureautique|Salle informatique|M. Ricky Malanda"],
Jeu:["8h–10h|Introduction au droit|Salle 5|M. Tsassa","11h–13h|Mathématiques appliquées 1|Salle 6|M. Jean Ngoma","14h–16h|Culture d’ouverture|Salle 5|M. Ngayou"],
Ven:["8h–10h|Économie|Salle 5|M. Moukanza","11h–12h45|Club d’anglais|Salle 5|","14h–16h|Droit des personnes|Salle 5|M. Gatabantou"],
Sam:["8h–10h|Introduction à l’organisation judiciaire|Salle 6|M. Nsouari","11h–13h|Environnement juridique|Salle 7|M. Pandi"]};
var MAT="Introduction à la comptabilité|7;Méthodologie de présentation des travaux|0,5;Économie 1|4;Économie 2|3;Culture d’ouverture|1;Informatique bureautique|3;Introduction au droit|4;Environnement juridique|2;Théorie générale de l’acte juridique|2;Introduction à l’organisation judiciaire|2;Fondements historiques du droit|4;Informatique juridique documentaire|0,5;Méthodologie juridique|1;Droit constitutionnel|3;Droit des personnes|3;Droit des personnes : compléments|1;Droit des biens|3;Droit des biens : compléments|1;Histoire des institutions|1;Anglais des affaires|4;Communication professionnelle écrite 1|2;Communication professionnelle orale 1|2;Droit des obligations|3;Contrats en entreprise|2;Entreprise et responsabilité|1".split(";");
var PRE=[["Introduction à la comptabilité",95],["Anglais des affaires",90],["Droit des personnes",100],["Économie",88],["Introduction au droit",92],["Informatique bureautique",85]];
var EXA=[["22 – 27 févr. 2027","Blocus (préparation aux examens du semestre 1)"],["1er – 20 mars 2027","Session ordinaire d’examens du semestre 1"],["23 août – 4 sept. 2027","Session d’examens de rattrapage"]];
var NOT=[["13 nov.","Accueil des nouveaux étudiants"],["17 nov.","Début des cours du semestre 1"],["28 nov.","Fête de la République : jour férié"]];
var DOC=["Attestation d’inscription","Relevé de notes","Carte d’étudiant"];
var g=new Date().getDay();
var S={s:"onb",tab:"home",d:g>=1&&g<=6?g-1:0,user:"",fil:"",nm:"",fl:""},app=document.getElementById("app");
try{var me=JSON.parse(localStorage.getItem("heldv_me")||"null");if(me&&me.n&&me.f){S.nm=S.user=me.n;S.fl=S.fil=me.f;S.s="app"}}catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var FIL=[["BSM","Management d’entreprise"],["ISIT","Interprétariat et Traduction"],["ISEC","Comptabilité et Gestion"],["ISERH","Gestion des ressources humaines"],["IUD","Droit des Affaires"],["ISTRAL","Transports et logistique"]];
function FN(){var f=FIL.filter(function(x){return x[0]===S.fil})[0];return esc(f?f[0]+" · "+f[1]:"")}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;app.appendChild(t);setTimeout(function(){t.remove()},2300)}
function login(){S.user=S.nm;S.fil=S.fl;S.s="app";S.tab="home";try{localStorage.setItem("heldv_me",JSON.stringify({n:S.nm,f:S.fl}))}catch(e){}draw()}
function onb(){return `<div class="hero"><div class="cap"><div class="badge"><img src="${EM}" alt=""></div></div><div class="txt"><div class="kick">HELDV · MOBILE</div><h1>Ton campus dans la poche</h1><p>Planning, cours, échéances et annonces de l’école : tout ce qu’il te faut, au même endroit.</p><button class="go" data-a="start"><span>Entrer</span><span>→</span></button></div></div>`}
function ident(){return `<div class="idt"><div class="hd"><button data-a="back" aria-label="Retour">‹</button><img src="${EM}" alt=""><b>HELDV Mobile</b></div><div class="sh"><h1>Dis-nous qui tu es</h1><p>Ton nom et ta filière suffisent pour personnaliser ton espace.</p><label for="nm">Nom complet</label><input id="nm" class="in" placeholder="Ex. Jean Mabiala" autocomplete="name" value="${esc(S.nm||"")}"><label for="fl">Filière</label><select id="fl" class="in"><option value="">Choisis ta filière</option>${FIL.map(function(f){return `<option value="${f[0]}"${S.fl===f[0]?" selected":""}>${f[0]} · ${f[1]}</option>`}).join("")}</select><button class="go" data-a="go"><span>Accéder à mon espace</span><span>→</span></button></div></div>`}
function shell(t,sub,body){var N=[["home","🏠","Mon espace"],["edt","⏰","Planning"],["mat","🎓","Cours"],["exa","📅","Échéances"],["msg","🔔","Infos"]];
return `<div class="app"><div class="bar0"><img src="${EM}" alt=""><div><h2>${t}</h2><small>${sub}</small></div><button class="out" data-a="out" aria-label="Se déconnecter">⎋</button></div><div class="main">${body}</div><div class="fnav">${N.map(function(n){return `<button class="${S.tab===n[0]?"on":""}" data-t="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`}).join("")}</div></div>`}
function line(p){var q=p.split("|"),m=[q[2],q[3]].filter(Boolean).join(" · ");return `<div class="row" style="margin-top:10px"><div><b>${esc(q[1])}</b><div class="m">${esc(m)}</div></div><span class="tag">${esc(q[0])}</span></div>`}
function tl(l){var q=l.split("|"),m=[q[2],q[3]].filter(Boolean).join(" · ");return `<div class="ev"><i></i><span class="tag">${esc(q[0])}</span><b>${esc(q[1])}</b><div class="m">${esc(m)}</div></div>`}
function home(){var d=D[(new Date().getDay()+6)%7]||"Dim",L=S.fil==="IUD"?(TT[d]||[]):[];
return `<div class="card"><div class="row"><h3>Aujourd’hui</h3><span class="tag">${d}</span></div>${L.length?`<div class="tl">${L.map(tl).join("")}</div>`:`<p class="m">Aucun cours à afficher aujourd’hui.</p>`}</div><div class="rail"><button class="tile" data-t="suivi"><div class="m">Assiduité</div><div class="big">92 %</div><span class="tag">démo</span></button><button class="tile" data-t="suivi"><div class="m">Frais réglés</div><div class="big">67 %</div><span class="tag">démo</span></button><button class="tile" data-t="exa"><div class="m">Prochaine épreuve</div><b>22 févr. 2027</b></button><button class="tile" data-t="msg"><div class="m">Annonces</div><div class="big">3</div></button></div><p class="note">Prototype : l’assiduité, les frais et les documents sont fictifs.</p>`}
function edt(){if(S.fil!=="IUD")return `<div class="card"><p class="m">L’emploi du temps de cette filière sera bientôt disponible.</p></div>`;return `<div class="chips">${D.map(function(x,i){return `<button class="${i===S.d?"on":""}" data-d="${i}">${x}</button>`}).join("")}</div><div class="card"><div class="m">IUD 1 · démarrage du semestre 1 · 2026-2027</div>${(TT[D[S.d]]||[]).map(line).join("")}</div>`}
function mats(){if(S.fil!=="IUD")return `<div class="card"><p class="m">La liste des matières de cette filière sera bientôt disponible.</p></div>`;var t=0;var r=MAT.map(function(l){var p=l.split("|");t+=parseFloat(p[1].replace(",","."));return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(p[0])}</span><span class="tag">${p[1]} ECTS</span></div>`}).join("");
return `<div class="card"><h3>Droit des Affaires · L1</h3><div class="m">Total : ${String(t).replace(".",",")} ECTS</div>${r}</div>`}
function suivi(){return `<button class="link" style="color:var(--a);margin:0 0 10px" data-t="home">‹ Retour</button><div class="card"><div class="row"><h3>Assiduité</h3><span class="tag">démo</span></div>${PRE.map(function(p){return `<div style="margin-top:10px"><div class="row"><span>${esc(p[0])}</span><b>${p[1]} %</b></div><div class="bar"><i style="width:${p[1]}%"></i></div></div>`}).join("")}</div><div class="card"><div class="row"><h3>Frais de scolarité</h3><span class="tag">démo</span></div><div class="bar"><i style="width:67%"></i></div><div class="m">2 versements sur 3 réglés</div><div class="row" style="margin-top:8px"><span>1er versement</span><b>Réglé</b></div><div class="row"><span>2e versement</span><b>Réglé</b></div><div class="row"><span>3e versement</span><b>À régler</b></div></div>`}
function exa(){return `<div class="card"><h3>Calendrier des épreuves</h3>${EXA.map(function(e){return `<div style="margin-top:10px"><span class="tag">${e[0]}</span><div>${esc(e[1])}</div></div>`}).join("")}</div><div class="card"><h3>Notes</h3><p class="m">Pas encore de note publiée. Elles s’afficheront ici dès que l’école les aura validées.</p></div>`}
function msg(){return `<div class="card"><h3>Dernières annonces</h3>${NOT.map(function(n){return `<div style="margin-top:10px"><span class="tag">${n[0]}</span><div>${esc(n[1])}</div></div>`}).join("")}</div><div class="card"><div class="row"><h3>Documents à demander</h3><span class="tag">démo</span></div>${DOC.map(function(d){return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(d)}</span><button class="tag" data-a="req">Demander</button></div>`}).join("")}</div>`}
function stu(){var T={home:["Bonjour "+esc(S.user)+" 👋",FN(),home],edt:["Planning de la semaine",FN(),edt],mat:["Mes cours",FN(),mats],suivi:["Mon suivi",FN(),suivi],exa:["Échéances et notes","Année 2026-2027",exa],msg:["Infos de l’école","Annonces et documents",msg]}[S.tab];return shell(T[0],T[1],T[2]())}
function draw(){app.innerHTML=S.s==="onb"?onb():S.s==="ident"?ident():stu()}
app.addEventListener("click",function(e){var b=e.target.closest("[data-a],[data-t],[data-d]");if(!b)return;var a=b.dataset.a;
if(b.dataset.t){S.tab=b.dataset.t}else if(b.dataset.d){S.d=+b.dataset.d}
else if(a==="start"){S.s="ident"}else if(a==="back"){S.s="onb"}
else if(a==="go"){S.nm=document.getElementById("nm").value.trim();S.fl=document.getElementById("fl").value;if(!S.nm||!S.fl){toast("Entrez votre nom et choisissez votre filière.");return}login();return}
else if(a==="out"){S.s="ident";S.user="";S.fil="";S.nm="";S.fl="";try{localStorage.removeItem("heldv_me")}catch(e){}}else if(a==="req"){toast("Demande envoyée (démo).");return}
draw()});
draw();
</script>
